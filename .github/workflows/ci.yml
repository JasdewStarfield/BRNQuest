name: CI

on:
  push:
    branches: ["mc/1.21.1-neoforge"]
  pull_request:
    branches: ["mc/1.21.1-neoforge"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, API contract, and build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Unit tests include package/classloading rules; the example add-on is the source-compatibility gate.
      - name: Verify tests and extension API contract
        run: ./gradlew test compileExampleAddonJava --no-daemon --console=plain

      - name: Build distributable
        run: ./gradlew build --no-daemon --console=plain
