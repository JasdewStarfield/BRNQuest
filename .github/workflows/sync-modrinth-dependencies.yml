name: Sync Modrinth version dependencies

on:
  workflow_dispatch:
    inputs:
      source_version:
        description: Existing version number to copy dependencies from
        required: true
        type: string
      target_version:
        description: Existing version number to update in place
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: brnquest-modrinth-metadata-${{ inputs.target_version }}
  cancel-in-progress: false

env:
  SOURCE_VERSION: ${{ inputs.source_version }}
  TARGET_VERSION: ${{ inputs.target_version }}
  MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID || 'k2cwPRGW' }}

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Copy dependencies and verify unchanged release contents
        shell: pwsh
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/mc/1.21.1-neoforge') { throw 'Run metadata updates from mc/1.21.1-neoforge.' }
          if (-not $env:MODRINTH_TOKEN) { throw 'Set MODRINTH_TOKEN.' }
          $headers = @{ Authorization = $env:MODRINTH_TOKEN; 'User-Agent' = 'JasdewStarfield/BRNQuest-release-automation (github.com/JasdewStarfield/BRNQuest)' }
          $apiBase = 'https://api.modrinth.com/v2'
          # Restrict both versions to the configured project before any write.
          $versions = Invoke-RestMethod -Uri "$apiBase/project/$($env:MODRINTH_PROJECT_ID)/version" -Headers $headers
          $sources = @($versions | Where-Object version_number -eq $env:SOURCE_VERSION)
          $targets = @($versions | Where-Object version_number -eq $env:TARGET_VERSION)
          if ($sources.Count -ne 1 -or $targets.Count -ne 1) { throw 'Source and target must each identify one existing project version.' }
          $source = $sources[0]
          $target = $targets[0]
          if ($source.id -eq $target.id) { throw 'Choose different source and target versions.' }
          function Convert-DependencyList($items) {
              $normalized = @($items | Select-Object project_id, version_id, file_name, dependency_type | Sort-Object project_id, version_id, file_name, dependency_type)
              ConvertTo-Json -InputObject $normalized -Depth 8 -Compress
          }
          $dependencies = @($source.dependencies | Select-Object project_id, version_id, file_name, dependency_type)
          if ($dependencies.Count -eq 0) { throw 'The source version has no dependencies to copy.' }
          $expected = Convert-DependencyList $dependencies
          # Keep future releases aligned with the same reviewed dependency settings.
          $template = Get-Content tools/release/platform-metadata.json -Raw -Encoding utf8 | ConvertFrom-Json
          if ((Convert-DependencyList $template.modrinth.dependencies) -cne $expected) { throw 'Update the publishing template to match the source dependencies first.' }
          $originalFiles = ConvertTo-Json -InputObject @($target.files) -Depth 12 -Compress
          if ((Convert-DependencyList $target.dependencies) -cne $expected) {
              # PATCH only the dependency field; the existing file and changelog remain in place.
              $body = @{ dependencies = $dependencies } | ConvertTo-Json -Depth 8 -Compress
              $null = Invoke-RestMethod -Method Patch -Uri "$apiBase/version/$($target.id)" -Headers $headers -ContentType 'application/json; charset=utf-8' -Body ([System.Text.Encoding]::UTF8.GetBytes($body))
          }
          $updated = Invoke-RestMethod -Uri "$apiBase/version/$($target.id)" -Headers $headers
          if ((Convert-DependencyList $updated.dependencies) -cne $expected) { throw 'Dependency readback differs from the source version.' }
          if ($updated.changelog -cne $target.changelog -or (ConvertTo-Json -InputObject @($updated.files) -Depth 12 -Compress) -cne $originalFiles) { throw 'Release files or changelog changed during the metadata update.' }
          Write-Host "[BRNQuest Release] Verified $($updated.version_number) ($($updated.id)): $($dependencies.Count) dependencies copied from $($source.version_number); files and changelog unchanged."
          $updated.dependencies | Select-Object project_id, version_id, file_name, dependency_type | ConvertTo-Json -Depth 8
