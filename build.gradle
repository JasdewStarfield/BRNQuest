plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.121'
}

// A second validation build can coexist with a running development client holding the default artifacts.
if (providers.gradleProperty('brnquestBuildDir').isPresent()) {
    layout.buildDirectory = layout.projectDirectory.dir(providers.gradleProperty('brnquestBuildDir').get())
}

version = mod_version
group = mod_group_id

base {
    // Keep the Minecraft line in artifacts because future worktrees may share the mod version.
    archivesName = "${mod_id}-mc${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def opacSmokeRequested = gradle.startParameter.taskNames.any { it.tokenize(':').last() in ['runOpacSmokeServer', 'runOpacRestartServer', 'runOpacFallbackServer'] }
def includeOpac = providers.gradleProperty('includeOpac').isPresent() || opacSmokeRequested
// Compilation modules stay independent; runtime assembly can omit built-ins for absence/recovery checks.
def includeBuiltin = !providers.gradleProperty('excludeBuiltin').isPresent()
def legacyAddon = providers.gradleProperty('legacyAddon').isPresent()
def includeExampleAddon = !providers.gradleProperty('excludeExampleAddon').isPresent() && !legacyAddon
def includeGameTests = gradle.startParameter.taskNames.any { it.tokenize(':').last() in ['runGameTestServer', 'runClient'] }
def moduleSmokeRequested = gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'runModuleSmokeServer' }
def moduleSmokePhase = providers.gradleProperty('moduleSmokePhase').getOrElse(includeBuiltin ? 'restored' : 'absent')
// KubeJS is opt-in for runtime tests because its client-sync hook cannot target GameTest mock players.
def kubeJsSmokeRequested = gradle.startParameter.taskNames.any {
    it.tokenize(':').last() in ['runKubeJsSmokeServer', 'runKubeJsReloadSmokeServer']
}
def includeKubeJs = providers.gradleProperty('includeKubeJs').isPresent() || kubeJsSmokeRequested
def includeJei = !providers.gradleProperty('excludeJei').isPresent() && !kubeJsSmokeRequested

// Both unit fixtures and automated worlds stay outside workspace file watchers. User runClient worlds stay put.
def isolatedTestRoot = providers.gradleProperty('brnquestTestTempDir').getOrElse(
        new File(System.getenv('TEMP') ?: System.getProperty('java.io.tmpdir'), 'brnquest-file-io-outside').absolutePath)
def gameTestRunDirectory = layout.dir(providers.provider {
    new File(isolatedTestRoot, 'gametest-' + Integer.toHexString(projectDir.canonicalPath.hashCode()))
}).get()
def kubeJsSmokeRunDirectory = layout.projectDirectory.dir('run/kubejs-smoke')
def kubeJsReloadSmokeRunDirectory = layout.projectDirectory.dir('run/kubejs-reload-smoke')
def resetGameTestBrnQuestState = tasks.register('resetGameTestBrnQuestState', Delete) {
    delete gameTestRunDirectory.dir('config/brnquest'), gameTestRunDirectory.dir('world'),
            gameTestRunDirectory.dir('kubejs')
}
def prepareGameTestFixture = tasks.register('prepareGameTestFixture', Sync) {
    dependsOn resetGameTestBrnQuestState
    from layout.projectDirectory.dir('src/test/resources/fixtures/ftb_v13/eow')
    into gameTestRunDirectory.dir('config/brnquest/imports/eow')
}
// Native advancement fixtures never enter the user's runClient world or the distributed mod JAR.
def prepareAdvancementGameTestFixture = tasks.register('prepareAdvancementGameTestFixture', Copy) {
    dependsOn resetGameTestBrnQuestState
    from layout.projectDirectory.dir('src/test/resources/fixtures/advancement_pack')
    into gameTestRunDirectory.dir('world/datapacks/brnquest_f3')
}
prepareGameTestFixture.configure { dependsOn prepareAdvancementGameTestFixture }
// Native loot fixtures are copied only into the isolated automated world, never the distributed resources.
def prepareLootGameTestFixture = tasks.register('prepareLootGameTestFixture', Copy) {
    dependsOn resetGameTestBrnQuestState
    from layout.projectDirectory.dir('src/test/resources/fixtures/loot_pack')
    into gameTestRunDirectory.dir('world/datapacks/brnquest_f6')
}
prepareGameTestFixture.configure { dependsOn prepareLootGameTestFixture }

def resetKubeJsSmokeState = tasks.register('resetKubeJsSmokeState', Delete) {
    delete kubeJsSmokeRunDirectory.dir('config/brnquest'), kubeJsSmokeRunDirectory.dir('world'),
            kubeJsSmokeRunDirectory.dir('kubejs')
}
def prepareKubeJsSmokeFixture = tasks.register('prepareKubeJsSmokeFixture', Copy) {
    dependsOn resetKubeJsSmokeState
    from layout.projectDirectory.dir('src/test/resources/kubejs_smoke')
    into kubeJsSmokeRunDirectory.dir('kubejs')
}
def resetKubeJsReloadSmokeState = tasks.register('resetKubeJsReloadSmokeState', Delete) {
    delete kubeJsReloadSmokeRunDirectory.dir('config/brnquest'), kubeJsReloadSmokeRunDirectory.dir('world'),
            kubeJsReloadSmokeRunDirectory.dir('kubejs'), kubeJsReloadSmokeRunDirectory.file('server.properties')
}
def prepareKubeJsReloadSmokeFixture = tasks.register('prepareKubeJsReloadSmokeFixture', Copy) {
    dependsOn resetKubeJsReloadSmokeState
    def fixture = layout.projectDirectory.dir('src/test/resources/kubejs_reload_smoke')
    into kubeJsReloadSmokeRunDirectory
    from fixture.file('server.properties')
    into('kubejs/server_scripts') { from fixture.dir('server_scripts') }
    into('kubejs/data') { from fixture.dir('data') }
}

sourceSets {
    // Only downstream modules see these outputs: javac for main cannot resolve built-in classes.
    builtin {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    integration {
        compileClasspath += sourceSets.main.output + sourceSets.builtin.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.builtin.output + sourceSets.integration.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    moduleTest {
        // This fixture must compile and start without any built-in output on its classpath.
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    test {
        compileClasspath += sourceSets.builtin.output + sourceSets.integration.output
        runtimeClasspath += sourceSets.builtin.output + sourceSets.integration.output
    }
    opacTest {
        // The lifecycle fixture is an external development mod and is never shipped in BRNQuest.
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    exampleAddon {
        // Compile the example exactly like an external consumer: main output is a dependency,
        // while its sources are not merged into the add-on source set.
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth OPAC'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'Latvian Mods'
        url = 'https://maven.latvian.dev/releases'
        content { includeGroup 'dev.latvian.mods' }
    }
    maven {
        name = 'Jared Maven'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
}

neoForge {
    version = project.neo_version

    [sourceSets.builtin, sourceSets.integration, sourceSets.gameTest, sourceSets.moduleTest].each {
        addModdingDependenciesTo it
    }

    runs {
        moduleSmokeServer {
            server()
            gameDirectory = layout.dir(providers.provider { new File(isolatedTestRoot, 'module-smoke') }).get()
            programArgument '--nogui'
            systemProperty 'brnquest.module.phase', moduleSmokePhase
        }
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', (includeExampleAddon || legacyAddon)
                    ? "${project.mod_id},brnquest_example" : project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = gameTestRunDirectory
            systemProperty 'java.io.tmpdir', isolatedTestRoot
            // IDE and Gradle launches receive the same deterministic fixture and isolated workspace.
            taskBefore prepareGameTestFixture
            systemProperty 'neoforge.enabledGameTestNamespaces', (includeExampleAddon || legacyAddon)
                    ? "${project.mod_id},brnquest_example" : project.mod_id
        }

        kubeJsSmokeServer {
            server()
            gameDirectory = kubeJsSmokeRunDirectory
            programArgument '--nogui'
            // A real server lifecycle avoids KubeJS sending client payloads to mock GameTest players.
            taskBefore prepareKubeJsSmokeFixture
        }

        kubeJsReloadSmokeServer {
            server()
            gameDirectory = kubeJsReloadSmokeRunDirectory
            programArgument '--nogui'
            // This isolated server performs a deliberate bad second script load and then stops via mcfunction.
            taskBefore prepareKubeJsReloadSmokeFixture
        }

        opacSmokeServer {
            server()
            gameDirectory = layout.projectDirectory.dir('run/opac-smoke')
            programArgument '--nogui'
            systemProperty 'brnquest.opac.smoke', 'initial'
        }
        opacRestartServer {
            server()
            gameDirectory = layout.projectDirectory.dir('run/opac-smoke')
            programArgument '--nogui'
            systemProperty 'brnquest.opac.smoke', 'restart'
        }
        opacFallbackServer {
            server()
            gameDirectory = layout.projectDirectory.dir('run/opac-fallback')
            programArgument '--nogui'
            systemProperty 'brnquest.opac.smoke', 'initial'
            systemProperty 'brnquest.opac.disableHooks', 'true'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            // Registry diagnostics are useful while the initial type registries are being built.
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            if (includeBuiltin) {
                sourceSet(sourceSets.builtin)
                sourceSet(sourceSets.integration)
            }
            if (includeGameTests && includeBuiltin) sourceSet(sourceSets.gameTest)
        }
        if (moduleSmokeRequested) {
            brnquest_module_test { sourceSet(sourceSets.moduleTest) }
        }
        if (opacSmokeRequested) {
            brnquest_opac_test { sourceSet(sourceSets.opacTest) }
        }
        if (includeExampleAddon) {
            brnquest_example {
                sourceSet(sourceSets.exampleAddon)
            }
        }
    }

    unitTest {
        // Merge test classes/resources into the BRNQuest test mod for the NeoForge JUnit launcher.
        testedMod = mods."${mod_id}"
        enable()
    }
}

// Data-generator output is compiled and packaged with handwritten resources.
sourceSets.main.resources { srcDir 'src/generated/resources' }

def generateGameTestStructure = tasks.register('generateGameTestStructure') {
    def encoded = file('src/gameTest/fixtures/empty.nbt.b64')
    def generated = layout.buildDirectory.file('generated/gametestResources/data/brnquest/structure/empty.nbt')
    inputs.file encoded
    outputs.file generated
    doLast {
        // Keep the tiny binary structure reproducible and reviewable as Base64 in source control.
        def target = generated.get().asFile
        target.parentFile.mkdirs()
        target.bytes = Base64.decoder.decode(encoded.getText('UTF-8').trim())
    }
}
sourceSets.gameTest.resources.srcDir layout.buildDirectory.dir('generated/gametestResources')
tasks.named('processGameTestResources').configure { dependsOn generateGameTestStructure }
tasks.named('processResources').configure {
    // Ship the human-readable dependency notice beside the embedded library metadata.
    from('THIRD_PARTY_NOTICES.md') { into 'META-INF' }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            jei_version_range      : jei_version_range,
            kubejs_version_range   : kubejs_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

// Generate loader metadata for command-line builds and IDE synchronization alike.
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

configurations {
    // ModDevGradle does not create this convention here; keep local optional mods out of published metadata.
    localRuntime
    runtimeClasspath.extendsFrom(localRuntime)
}

dependencies {
    // markdown_v1 uses only CommonMark core; Jar-in-Jar keeps dedicated servers self-contained.
    jarJar(implementation('org.commonmark:commonmark:0.30.0') { transitive = false }) {
        version {
            strictly '[0.30.0]'
            prefer '0.30.0'
        }
    }
    // Minecraft 1.21.1 runs do not automatically expose ordinary embedded Java libraries.
    additionalRuntimeClasspath('org.commonmark:commonmark:0.30.0') { transitive = false }
    // Exact audited optional API baseline; never bundle OPAC or load it in ordinary core tests.
    compileOnly("maven.modrinth:open-parties-and-claims:AzM8UF04") { transitive = false }
    if (includeOpac) {
        localRuntime("maven.modrinth:open-parties-and-claims:AzM8UF04") { transitive = false }
    }
    // The KubeJS entry point lives behind plugin discovery; these types never enter core initialization.
    compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
    compileOnly("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }
    if (includeKubeJs) {
        // The explicit integration run exercises the binding while normal GameTests stay vanilla-only.
        localRuntime("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
        localRuntime("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }
    }
    // Compile the isolated JEI plugin against its API without making JEI a published hard dependency.
    integrationCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    integrationCompileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    if (includeJei) {
        // Local runs include JEI by default; -PexcludeJei proves the dependency-absent path.
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }
    if (legacyAddon) {
        // Load the frozen pre-P5c JAR as a real external mod; no companion sources participate.
        localRuntime files('src/test/compatibility/experimental26/brnquest-example-experimental26.jar')
    }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Bytecode-level dependency rules catch client/server leaks that source-string checks miss.
    testImplementation('com.tngtech.archunit:archunit-junit5:1.5.0') {
        // NeoForge pins SLF4J 2.0.9 strictly; ArchUnit only needs the compatible API at test runtime.
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
}

// Compile legacy consumers against the exact experimental.22 interfaces from commit 550e802.
// TaskType and RewardType were unchanged in experimental.23.
// The fixture output is not a runtime dependency: tests load only its consumer against today's SPI.
def legacyPresentationClasses = layout.buildDirectory.dir('compatibility/experimental22')
def compileLegacyPresentation = tasks.register('compileLegacyPresentation', JavaCompile) {
    dependsOn tasks.named('classes')
    source fileTree('src/test/compatibility/experimental22') { include '**/*.java' }
    classpath = sourceSets.main.output + sourceSets.main.compileClasspath
    destinationDirectory = legacyPresentationClasses
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
    options.encoding = 'UTF-8'
}

// Keep the old field-editor consumer binary separate from the runtime SPI.
def legacyEditorClasses = layout.buildDirectory.dir('compatibility/experimental25')
def compileLegacyEditor = tasks.register('compileLegacyEditor', JavaCompile) {
    dependsOn tasks.named('classes')
    source fileTree('src/test/compatibility/experimental25') { include '**/*.java' }
    classpath = sourceSets.main.output + sourceSets.main.compileClasspath
    destinationDirectory = legacyEditorClasses
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
    options.encoding = 'UTF-8'
}

test {
    dependsOn compileLegacyPresentation, compileLegacyEditor, tasks.named('compileExampleAddonJava')
    systemProperty 'brnquest.legacyEditorClasses', legacyEditorClasses.get().asFile.absolutePath
    systemProperty 'brnquest.legacyPresentationClasses', legacyPresentationClasses.get().asFile.absolutePath
    useJUnitPlatform()
    // Unit tests reproduce loader-owned plugin registration explicitly.
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    // Keep short-lived test trees outside workspace watchers; allow CI to choose its own isolated root.
    def testTemp = isolatedTestRoot
    systemProperty 'java.io.tmpdir', testTemp
    systemProperty 'junit.jupiter.tempdir.basedir', testTemp
    doFirst { new File(testTemp).mkdirs() }
    // NeoForge tests use a transformed class loader without a conventional code source;
    // provide an explicit project root for the public-signature contract test.
    systemProperty 'brnquest.projectDir', projectDir.absolutePath
    systemProperty 'brnquest.buildDir', layout.buildDirectory.get().asFile.absolutePath
}

// A normal build must prove the public-only companion source still compiles.
tasks.named('check').configure { dependsOn tasks.named('compileExampleAddonJava') }

idea.module {
    downloadSources = true
    downloadJavadoc = true
}

tasks.named('runKubeJsSmokeServer').configure {
    doLast {
        def log = kubeJsSmokeRunDirectory.file('logs/latest.log').asFile
        if (!log.isFile() || !log.getText('UTF-8').contains('[BRNQuest/KUBEJS_SMOKE] events-and-extensions-ready')) {
            throw new GradleException('KubeJS server-script smoke marker was not observed')
        }
    }
}

tasks.named('runKubeJsReloadSmokeServer').configure {
    doLast {
        def log = kubeJsReloadSmokeRunDirectory.file('logs/latest.log').asFile
        def text = log.isFile() ? log.getText('UTF-8') : ''
        if (!text.contains('[BRNQuest/KUBEJS_RELOAD_SMOKE] initial-pair-ready')
                || !text.contains('[BRNQuest/KUBEJS_RELOAD_SMOKE] intentional reload failure')
                || !text.contains('[BRNQuest/KUBEJS] Rejected script/task-book reload; retained revision')
                || !text.contains('task types [kubejs_reload_smoke:type_a]')) {
            throw new GradleException('KubeJS failed-reload rollback markers were not all observed')
        }
    }
}

// Fixtures use their own world, ephemeral port and reproducible server options; restart retains that world.
['OpacSmoke', 'OpacRestart', 'OpacFallback'].each { label ->
    tasks.named("run${label}Server").configure {
        doFirst {
            def runRoot = layout.projectDirectory.dir(label == 'OpacFallback' ? 'run/opac-fallback' : 'run/opac-smoke').asFile
            runRoot.mkdirs()
            new File(runRoot, 'server.properties').setText('server-port=0\nonline-mode=false\nlevel-type=minecraft:flat\ngenerator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}\ngenerate-structures=false\nspawn-protection=0\nview-distance=2\nsimulation-distance=2\n', 'UTF-8')
        }
        doLast {
            def runRoot = layout.projectDirectory.dir(label == 'OpacFallback' ? 'run/opac-fallback' : 'run/opac-smoke').asFile
            def log = new File(runRoot, 'logs/latest.log')
            def phase = label == 'OpacRestart' ? 'restart' : 'initial'
            if (!log.isFile() || !log.getText('UTF-8').contains("[BRNQuest/OPAC_SMOKE] ${phase} PASS")) {
                throw new GradleException('OPAC lifecycle fixture did not pass')
            }
        }
    }
}

// The shipping artifact retains the established single-JAR installation and loader identity.
tasks.named('jar').configure {
    from sourceSets.builtin.output
    from sourceSets.integration.output
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

// Isolated lifecycle runs retain the same world between missing-module and restoration phases.
tasks.named('runModuleSmokeServer').configure {
    doFirst {
        def root = new File(isolatedTestRoot, 'module-smoke')
        root.mkdirs()
        new File(root, 'server.properties').setText('server-port=0\nonline-mode=false\nlevel-type=minecraft:flat\ngenerator-settings={"layers":[{"block":"minecraft:bedrock","height":1}],"biome":"minecraft:plains"}\ngenerate-structures=false\nview-distance=2\nsimulation-distance=2\n', 'UTF-8')
    }
    doLast {
        def log = new File(isolatedTestRoot, 'module-smoke/logs/latest.log')
        if (!log.isFile() || !log.getText('UTF-8').contains("[BRNQuest/MODULE_SMOKE] ${moduleSmokePhase} PASS")) {
            throw new GradleException('Module absence/restoration fixture did not pass')
        }
    }
}

apply from: 'gradle/module-boundaries.gradle'

if (legacyAddon) {
    tasks.named('runGameTestServer').configure {
        dependsOn 'verifyLegacyAddon'
        doLast {
            def log = gameTestRunDirectory.file('logs/latest.log').asFile
            if (!log.isFile() || !log.getText('UTF-8').contains('(brnquest_example)')) {
                throw new GradleException('Frozen add-on was not discovered as an installed mod')
            }
        }
    }
}
