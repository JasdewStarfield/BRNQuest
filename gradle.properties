# Gradle defaults; release and validation commands may override these explicitly.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Environment properties.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.216
neo_version_range=[21.1,22)
loader_version_range=[4,5)

# Development dependencies stay pinned; runtime ranges admit older builds on the same Minecraft line.
jei_version=19.25.1.334
jei_version_range=[19.8.4.110,20)

# Optional server scripting integration; these are verified development baselines, not hard dependencies.
kubejs_version=2101.7.2-build.374
kubejs_version_range=[2101.7.0-build.126,2102)
rhino_version=2101.2.8-build.91

# Mod properties.
mod_id=brnquest
mod_name=BRNQuest
mod_license=MIT
mod_version=1.0.1
mod_group_id=yourscraft.jasdewstarfield
mod_authors=Jasdew Starfield
mod_description=A server-authoritative, data-driven quest system for Minecraft modpacks.
