modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/JasdewStarfield/BRNQuest/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "assets/brnquest/textures/gui/icon.png"
displayURL = "https://github.com/JasdewStarfield/BRNQuest"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# JEI discovers BRNQuest's client plugin only when present; core gameplay never loads JEI classes.
[[dependencies."${mod_id}"]]
modId = "jei"
type = "optional"
versionRange = "${jei_version_range}"
ordering = "AFTER"
side = "CLIENT"

# KubeJS discovers the isolated binding plugin only when present.
[[dependencies."${mod_id}"]]
modId = "kubejs"
type = "optional"
versionRange = "${kubejs_version_range}"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "brnquest.opac.mixins.json"

[[mixins]]
config = "brnquest.client.mixins.json"

# Unsupported versions remain loadable but the provider stays personal-only.
[[dependencies."${mod_id}"]]
modId = "openpartiesandclaims"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"
